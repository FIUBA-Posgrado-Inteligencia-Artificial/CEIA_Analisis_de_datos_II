[project]
name = "add2-env"
version = "0.1.0"
description = "AndDII"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aif360>=0.6.1",
    "aequitas",
    "alibi==0.9.6",
    "category-encoders>=2.10.0",
    "evidently>=0.7.21",
    "fairlearn>=0.14.0",
    "feature-engine>=1.9.4",
    "featuretools>=1.31.0",
    "great-expectations>=1.21.0",
    "hdbscan>=0.8.44",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "lightgbm>=4.7.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.11.1",
    "missingno>=0.5.2",
    "numpy",
    "opentsne>=1.0.4",
    "pandas",
    "pyod>=3.6.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.11.4,<1.18.0",
    "seaborn>=0.13.2",
    "shap",
    "umap-learn>=0.5.12",
    "xgboost>=3.4.1",
]
[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.uv]
package = false